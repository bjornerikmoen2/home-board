name: home_board_web
description: Home Board - Family Chores and Rewards Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  
  # Routing
  go_router: ^14.6.2
  
  # HTTP Client
  dio: ^5.11.1
  
  # Local Storage
  shared_preferences: ^2.5.6
  
  # JSON Serialization
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  
  # UI
  flutter_svg: ^2.3.0
  intl: ^0.20.0
  
  # File Picker
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.16.2
  json_serializable: ^6.15.2
  freezed: ^4.0.3
  riverpod_generator: ^4.0.9
  
  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  
  # Assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
