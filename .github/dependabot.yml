# Pull requests for newer backend packages and GitHub Actions.
# Security fixes in the base images arrive through the weekly rebuild in CI. A new .NET major
# version is updated by hand. So are the Flutter packages: the frontend Dockerfile pins Flutter,
# which fixes some package versions exactly, so they move together with a Flutter upgrade.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /backend/src/HomeBoard.Api
      - /backend/src/HomeBoard.Infrastructure
      - /backend/tests/HomeBoard.Tests
    schedule:
      interval: weekly
      day: monday
    groups:
      test-packages:
        patterns: ["xunit*", "Moq", "MockQueryable*", "coverlet*", "Microsoft.NET.Test.Sdk"]
      dotnet-packages:
        patterns: ["Microsoft.*", "System.*", "Npgsql*", "Swashbuckle*"]
        update-types: [minor, patch]
      # Everything else in one pull request too: separate ones per project leave the
      # projects on different versions, which fails the build as a package downgrade.
      other-packages:
        patterns: ["*"]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
